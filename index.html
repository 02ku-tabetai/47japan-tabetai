<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>竹辺と一緒に47都道府県 〜美味しいもの見つけよう・食べよう〜</title>
  <style>
    :root {
      --done-orange: #FF8A3D;
      --next-pink: #FF4D8D;
      --unvisited: #EFEAE4;
      --choco-brown: #5A3826;
      --highlight-gold: #FFC107;
      --bg-base: #FAF6F0;
      --card-bg: #FFFFFF;
      --border-soft: #E8DFD5;
      --muted-text: #856E60;
    }

    html { scroll-behavior: smooth; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background-color: var(--bg-base);
      color: var(--choco-brown);
      line-height: 1.6;
      overflow-x: clip;
    }

    /* ヘッダー（優しい水玉ココアブラウン＋ロゴ） */
    header {
      background-color: #845D47;
      background-image:
        radial-gradient(rgba(255, 245, 235, 0.14) 4px, transparent 4.5px),
        radial-gradient(rgba(255, 245, 235, 0.11) 4px, transparent 4.5px),
        linear-gradient(180deg, #946C55 0%, #7B543E 100%);
      background-size: 36px 36px, 36px 36px, 100% 100%;
      background-position: 0 0, 18px 18px, 0 0;
      border-bottom: 5px solid var(--done-orange);
      box-shadow: 0 4px 16px rgba(90, 56, 38, 0.14);
      padding: 1.8rem 1rem 1.6rem;
      text-align: center;
    }
    .header-logo {
      max-width: min(500px, 92%);
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
    }
    #fallbackTitle { display: none; margin: 0; font-size: 1.6rem; color: #FFFDF9; }

    /* ヘッダー直下の追従目次バー（スクロールで上部に残る） */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 150;
      background: rgba(255, 253, 249, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1.5px solid var(--border-soft);
      box-shadow: 0 3px 10px rgba(90, 56, 38, 0.06);
      padding: 0.6rem 0.8rem;
    }
    .sticky-nav-inner {
      max-width: 1020px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .nav-link {
      display: inline-block;
      text-decoration: none;
      color: var(--choco-brown);
      font-size: 0.85rem;
      font-weight: bold;
      padding: 0.4rem 0.95rem;
      border-radius: 999px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .nav-link:hover { background: var(--unvisited); }
    .nav-link.active {
      background: var(--choco-brown);
      color: #fff;
      box-shadow: 0 2px 6px rgba(90, 56, 38, 0.18);
    }

    main { max-width: 1020px; margin: 0 auto; padding: 1.6rem 1rem 4rem; }

    /* サイト案内バナー */
    .intro-banner {
      background: #FFFDF9;
      border: 1.5px solid var(--border-soft);
      border-radius: 16px;
      padding: 1rem 1.4rem;
      margin-bottom: 1.5rem;
      text-align: center;
      box-shadow: 0 3px 10px rgba(90, 56, 38, 0.04);
    }
    .intro-badge {
      display: inline-block;
      background: #FFF0F5;
      color: #D12C68;
      border: 1px solid #FFC2D8;
      font-size: 0.76rem;
      font-weight: bold;
      padding: 0.15rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 0.45rem;
    }
    .intro-banner p {
      margin: 0;
      font-size: 0.93rem;
      font-weight: bold;
      color: var(--choco-brown);
      white-space: pre-line;
      line-height: 1.7;
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1.5px solid var(--border-soft);
      box-shadow: 0 3px 12px rgba(90, 56, 38, 0.04);
      scroll-margin-top: 70px;
    }
    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      border-left: 6px solid var(--done-orange);
      padding-left: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    /* 竹辺莉央さん紹介カード */
    .profile-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #FFFFFF 55%, #FFF8F1 100%);
    }
    .profile-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 2rem;
      z-index: 1;
    }
    .profile-illust-box {
      flex-shrink: 0;
      width: 280px;
      text-align: center;
      position: relative;
      padding: 0.4rem 0;
    }
    .profile-illust {
      height: 380px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 10px 18px rgba(90, 56, 38, 0.14));
      transition: transform 0.25s ease;
    }
    .profile-illust:hover { transform: translateY(-4px) scale(1.015); }
    .illust-caption {
      display: inline-block;
      margin-top: 0.45rem;
      padding: 0.15rem 0.7rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border-soft);
      font-size: 0.72rem;
      color: var(--muted-text);
    }

    .profile-body { flex: 1; min-width: 0; width: 100%; }
    .prof-quote {
      display: inline-block;
      background: #FFF0F5;
      color: #D12C68;
      border: 1.5px solid #FFC2D8;
      font-size: 0.9rem;
      font-weight: bold;
      padding: 0.32rem 0.95rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
      box-shadow: 0 2px 8px rgba(255, 77, 141, 0.1);
    }
    .profile-name-block {
      margin-bottom: 0.7rem;
      padding-bottom: 0.6rem;
      border-bottom: 2px dotted #E6D8CA;
    }
    .profile-ruby {
      display: block;
      font-size: 0.76rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--done-orange);
      font-weight: bold;
      margin-bottom: 0.1rem;
    }
    .profile-name { font-size: 1.85rem; font-weight: bold; margin: 0; letter-spacing: 0.04em; line-height: 1.25; }
    .profile-lead { font-size: 0.94rem; font-weight: bold; color: var(--muted-text); margin: 0.35rem 0 0; }

    .prof-spec-list {
      background: #FAF6F0;
      border: 1px solid #EDE3D8;
      border-radius: 14px;
      padding: 0.85rem 1rem;
      margin: 0.85rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .prof-spec-item { display: flex; align-items: flex-start; gap: 0.65rem; font-size: 0.9rem; }
    .prof-spec-label {
      flex-shrink: 0;
      background: #FFFFFF;
      border: 1px solid #E5D7C8;
      color: var(--choco-brown);
      font-size: 0.78rem;
      font-weight: bold;
      padding: 0.18rem 0.6rem;
      border-radius: 8px;
      min-width: 110px;
      text-align: center;
      margin-top: 0.1rem;
    }
    .prof-spec-text { flex: 1; color: var(--choco-brown); line-height: 1.55; word-break: break-word; }

    .prof-closing {
      background: #FFF9F2;
      border: 1.5px dashed #E8B88A;
      border-radius: 12px;
      padding: 0.55rem 0.9rem;
      font-size: 0.88rem;
      font-weight: bold;
      color: #B85214;
      text-align: center;
      margin-bottom: 0.85rem;
    }

    .profile-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.95rem; }
    .profile-tag {
      background: #FFFFFF;
      border: 1px solid #E2D5C7;
      color: var(--muted-text);
      font-size: 0.75rem;
      font-weight: bold;
      padding: 0.18rem 0.6rem;
      border-radius: 999px;
    }
    .profile-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .profile-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.5rem 1.15rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 3px 10px rgba(90, 56, 38, 0.14);
      transition: transform 0.15s, opacity 0.15s;
    }
    .profile-btn:hover { transform: translateY(-2px); opacity: 0.94; }

    /* 旅の記録コントロール行 */
    .map-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-bottom: 1.1rem;
    }
    .view-tabs { display: flex; gap: 0.55rem; flex-wrap: wrap; }
    .tab-btn {
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      border: 1.5px solid #D9CEC2;
      background: #fff;
      color: var(--choco-brown);
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.15s;
    }
    .tab-btn:hover { background: #FAF6F0; }
    .tab-btn.active { background: var(--choco-brown); border-color: var(--choco-brown); color: #fff; }

    .playlist-btn {
      display: inline-block;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      background: var(--next-pink);
      box-shadow: 0 2px 6px rgba(255, 77, 141, 0.25);
      transition: transform 0.15s, opacity 0.15s;
    }
    .playlist-btn:hover { transform: translateY(-2px); opacity: 0.92; }

    /* 進捗バー */
    .progress-wrap { margin-bottom: 0.9rem; }
    .progress-bar-bg { background: var(--unvisited); border-radius: 999px; height: 14px; overflow: hidden; }
    .progress-bar-fill { background: var(--done-orange); height: 100%; width: 0%; transition: width 0.5s ease; }

    .legend { display: flex; gap: 0.9rem; font-size: 0.84rem; margin-bottom: 0.9rem; flex-wrap: wrap; align-items: center; }
    .legend span { display: flex; align-items: center; gap: 0.35rem; }
    .dot { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }

    /* 日本地図（PC・スマホ両方で横スクロールなしフィット） */
    .map-scroll { width: 100%; padding: 4px 2px 6px; }
    .japan-map {
      display: grid;
      grid-template-columns: repeat(14, minmax(0, 1fr));
      grid-template-rows: repeat(11, 36px);
      gap: 4px;
      width: 100%;
    }
    .pref-tile {
      border: none;
      border-radius: 7px;
      font-size: 0.72rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: transform 0.12s, box-shadow 0.12s;
      padding: 2px;
      font-family: inherit;
      line-height: 1.1;
      min-width: 0;
    }
    .pref-tile:hover { transform: translateY(-2px); box-shadow: 0 3px 6px rgba(90,56,38,0.16); }
    .pref-tile.selected {
      transform: scale(1.08);
      box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4.5px var(--highlight-gold), 0 4px 10px rgba(255, 193, 7, 0.45);
      z-index: 3;
    }
    .status-done { background: var(--done-orange); color: #fff; }
    .status-next { background: var(--next-pink); color: #fff; }
    .status-none { background: var(--unvisited); color: var(--muted-text); }

    /* 開催順リスト */
    .ep-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr));
      gap: 0.65rem;
    }
    .ep-card {
      border: 1.5px solid var(--border-soft);
      border-radius: 12px;
      padding: 0.7rem 0.85rem;
      background: #fff;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      color: var(--choco-brown);
      transition: transform 0.12s, border-color 0.12s, background 0.12s, box-shadow 0.12s;
    }
    .ep-card:hover { transform: translateY(-2px); border-color: var(--done-orange); }
    .ep-card.selected {
      border: 2.5px solid var(--done-orange);
      background: #FFF6EE;
      box-shadow: 0 4px 12px rgba(255, 138, 61, 0.22);
    }
    .ep-card.is-next.selected {
      border-color: var(--next-pink);
      background: #FFF2F7;
      box-shadow: 0 4px 12px rgba(255, 77, 141, 0.22);
    }
    .ep-no { font-size: 0.75rem; font-weight: bold; color: var(--done-orange); }
    .ep-card.is-next .ep-no { color: var(--next-pink); }
    .ep-pref { font-size: 1.02rem; font-weight: bold; margin: 0.1rem 0; }
    .ep-sub { font-size: 0.76rem; color: var(--muted-text); }

    /* 詳細エリア */
    .detail-box {
      margin-top: 1.3rem;
      padding: 1.3rem;
      border-radius: 14px;
      background: #FCF9F5;
      border: 1.5px solid var(--border-soft);
      display: none;
    }
    .detail-box.active { display: block; }
    .detail-header { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .detail-header h3 { margin: 0; font-size: 1.35rem; }
    .badge { display: inline-block; padding: 0.22rem 0.8rem; border-radius: 999px; font-size: 0.8rem; font-weight: bold; color: #fff; }

    /* 大きなサムネカード（スマホではみ出さない安全設計） */
    .episode-videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
      gap: 1rem;
      margin-bottom: 1.2rem;
    }
    .ep-video-card {
      display: block; background: #fff; border-radius: 14px; overflow: hidden;
      text-decoration: none; color: var(--choco-brown); border: 1.5px solid var(--border-soft);
      box-shadow: 0 3px 10px rgba(90, 56, 38, 0.06); transition: transform 0.15s, box-shadow 0.15s;
      min-width: 0;
    }
    .ep-video-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(90, 56, 38, 0.12); }
    .ep-thumb-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #222; }
    .ep-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ep-play-badge {
      position: absolute; bottom: 8px; right: 8px; background: rgba(229, 57, 53, 0.92); color: #fff;
      padding: 0.28rem 0.8rem; border-radius: 999px; font-size: 0.78rem; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .ep-video-info { padding: 0.8rem 0.95rem; }
    .ep-video-step {
      display: inline-block; font-size: 0.75rem; font-weight: bold; color: #fff;
      background: var(--done-orange); padding: 0.15rem 0.6rem; border-radius: 6px; margin-bottom: 0.3rem;
    }
    .ep-video-step.eat { background: var(--next-pink); }
    .ep-video-title { font-size: 0.98rem; font-weight: bold; word-break: break-word; }

    /* 検索フォーム */
    .filters { display: grid; grid-template-columns: 2fr 1fr; gap: 0.65rem; margin-bottom: 0.85rem; }
    input, select {
      width: 100%; padding: 0.62rem 0.85rem; border: 1.5px solid #D9CEC2; border-radius: 10px;
      font-size: 0.92rem; font-family: inherit; color: var(--choco-brown); background: #fff;
    }
    input:focus, select:focus { outline: none; border-color: var(--choco-brown); }

    /* カテゴリタグ */
    .cat-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .cat-chip {
      padding: 0.35rem 0.8rem; border-radius: 999px; border: 1.5px solid #D9CEC2;
      background: #fff; color: var(--choco-brown); font-size: 0.8rem; font-weight: bold;
      cursor: pointer; font-family: inherit; transition: all 0.12s;
    }
    .cat-chip.active { background: var(--choco-brown); border-color: var(--choco-brown); color: #fff; }

    .tag.cat-sweets, .cat-chip.cat-sweets { background: #FFF0F5; color: #C2275E; border-color: #FFBBD2; }
    .cat-chip.cat-sweets.active { background: #E84A7F; color: #fff; border-color: #E84A7F; }

    .tag.cat-drink, .cat-chip.cat-drink { background: #EBF7FF; color: #1971A8; border-color: #A8D8F8; }
    .cat-chip.cat-drink.active { background: #2993D4; color: #fff; border-color: #2993D4; }

    .tag.cat-snack, .cat-chip.cat-snack { background: #FFF6DC; color: #9E6200; border-color: #F2D27A; }
    .cat-chip.cat-snack.active { background: #D9920B; color: #fff; border-color: #D9920B; }

    .tag.cat-side, .cat-chip.cat-side { background: #FFF0E5; color: #B84C14; border-color: #F7C29E; }
    .cat-chip.cat-side.active { background: #E06824; color: #fff; border-color: #E06824; }

    .tag.cat-meal, .cat-chip.cat-meal { background: #EDF8EA; color: #2E6F29; border-color: #B4DBA8; }
    .cat-chip.cat-meal.active { background: #4C9445; color: #fff; border-color: #4C9445; }

    .tag.cat-seasoning, .cat-chip.cat-seasoning { background: #F4ECE4; color: #5A3826; border-color: #D4BFA9; }
    .cat-chip.cat-seasoning.active { background: #7D523A; color: #fff; border-color: #7D523A; }

    /* スッキリリスト */
    .souvenir-list { background: #fff; border: 1.5px solid var(--border-soft); border-radius: 12px; overflow: hidden; }
    .item-row {
      display: flex; align-items: center; justify-content: space-between; gap: 0.7rem;
      padding: 0.72rem 0.95rem; border-bottom: 1px solid #F3ECE4; transition: background 0.1s;
    }
    .item-row:last-child { border-bottom: none; }
    .item-row:hover { background: #FCF9F5; }
    .item-main { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; flex: 1; min-width: 0; }
    .item-tags { display: flex; gap: 0.35rem; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
    .tag {
      font-size: 0.73rem; padding: 0.14rem 0.5rem; border-radius: 6px;
      border: 1px solid transparent; font-weight: bold; white-space: nowrap;
    }
    .tag.pref { background: var(--unvisited); color: var(--choco-brown); border-color: #DFD5CA; }
    .item-title { font-weight: bold; font-size: 0.95rem; word-break: break-word; }
    .item-memo { font-size: 0.82rem; color: var(--muted-text); width: 100%; }
    .time-link {
      flex-shrink: 0; font-size: 0.8rem; text-decoration: none; padding: 0.3rem 0.8rem;
      border-radius: 999px; background: #FFF4EB; color: #D45B12; font-weight: bold;
      border: 1.5px solid #FFD2B3; white-space: nowrap; transition: all 0.12s;
    }
    .time-link:hover { background: var(--done-orange); color: #fff; border-color: var(--done-orange); }

    footer { text-align: center; padding: 1.5rem 1rem; font-size: 0.78rem; color: var(--muted-text); }

    /* ==========================================
       📱 スマホ・タブレット最適化レスポンシブ
       ========================================== */
    @media (max-width: 780px) {
      .profile-wrap { flex-direction: column; gap: 1rem; }
      .profile-illust-box { width: 100%; }
      .profile-illust { height: 280px; }
      .prof-spec-item { flex-direction: column; gap: 0.25rem; }
      .prof-spec-label { min-width: auto; }
    }

    @media (max-width: 640px) {
      header { padding: 1.25rem 0.8rem; }
      .sticky-nav { padding: 0.45rem 0.4rem; }
      .sticky-nav-inner { gap: 0.25rem; }
      .nav-link { font-size: 0.74rem; padding: 0.35rem 0.6rem; }

      main { padding: 1rem 0.6rem 3rem; }
      .intro-banner { padding: 0.85rem 0.9rem; margin-bottom: 1rem; }
      .intro-banner p { font-size: 0.84rem; }

      .card { padding: 1rem 0.85rem; margin-bottom: 1rem; border-radius: 14px; scroll-margin-top: 56px; }
      h2 { font-size: 1.1rem; flex-direction: column; align-items: flex-start; gap: 0.2rem; }
      .profile-name { font-size: 1.55rem; }
      .profile-actions { flex-direction: column; }
      .profile-btn { width: 100%; }

      /* タブと再生リストをスマホで綺麗に整列 */
      .map-controls { flex-direction: column; align-items: stretch; gap: 0.5rem; }
      .view-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
      .tab-btn { padding: 0.5rem 0.3rem; font-size: 0.78rem; text-align: center; }
      .playlist-btn { width: 100%; text-align: center; font-size: 0.82rem; padding: 0.5rem; }

      /* スマホでも横スクロールなしで日本地図全体を表示 */
      .map-scroll { padding: 2px 0 4px; }
      .japan-map {
        grid-template-rows: repeat(11, 28px);
        gap: 2px;
      }
      .pref-tile {
        font-size: 8.5px;
        border-radius: 4px;
        padding: 1px;
        line-height: 1.05;
        word-break: break-all;
      }

      /* 開催順カードはスマホで2列 */
      .ep-grid { grid-template-columns: repeat(2, 1fr); gap: 0.45rem; }
      .ep-card { padding: 0.6rem 0.65rem; }
      .ep-pref { font-size: 0.95rem; }

      /* 詳細ボックスと動画カードの余白を詰めてはみ出しゼロに */
      .detail-box { padding: 0.9rem 0.75rem; margin-top: 1rem; }
      .detail-header h3 { font-size: 1.2rem; }
      .episode-videos { grid-template-columns: 1fr; gap: 0.85rem; }

      .filters { grid-template-columns: 1fr; }

    const CAT_META = {

    function esc(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function normPref(name) {
      name = (name || "").trim();
      if (name === "北海道") return "北海道";
      return name.replace(/[都府県]$/, "");
    }

    function parseCSV(text) {
      const rows = [];
      let row = [], col = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') { col += '"'; i++; }
          else if (ch === '"') { inQuotes = false; }
          else { col += ch; }
        } else {
          if (ch === '"') { inQuotes = true; }
          else if (ch === ',') { row.push(col); col = ""; }
          else if (ch === '\r' && next === '\n') { row.push(col); rows.push(row); row = []; col = ""; i++; }
          else if (ch === '\n' || ch === '\r') { row.push(col); rows.push(row); row = []; col = ""; }
          else { col += ch; }
        }
      }
      if (col !== "" || row.length > 0) { row.push(col); rows.push(row); }
      return rows;
    }

    let jsonpSeq = 0;
    function extractSheetInfo(rawUrl) {
      if (!rawUrl) return null;
      const trimmed = rawUrl.trim();
      const idMatch = trimmed.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (!idMatch || idMatch[1] === "e") return null;
      const gidMatch = trimmed.match(/gid=(\d+)/);
      return { id: idMatch[1], gid: gidMatch ? gidMatch[1] : "0" };
    }

    function loadSheetViaJsonp(rawUrl) {
      return new Promise((resolve, reject) => {
        const info = extractSheetInfo(rawUrl);
        if (!info) {
          reject(new Error("スプレッドシートの共有URL（/spreadsheets/d/ID/...）を指定してください。"));
          return;
        }
        const cbName = `__gsheet_cb_${++jsonpSeq}`;
        const script = document.createElement("script");
        let finished = false;

        const cleanup = () => {
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        };

        const timer = setTimeout(() => {
          if (finished) return;
          finished = true;
          cleanup();
          reject(new Error("読み込みタイムアウト：共有設定が『リンクを知っている全員（閲覧者）』になっているか確認してください。"));
        }, 8000);

        window[cbName] = (data) => {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          cleanup();
          if (!data || data.status === "error" || !data.table || !data.table.rows) {
            reject(new Error("データ取得エラー：共有設定をご確認ください。"));
            return;
          }
          const rows = data.table.rows.map(r =>
            (r.c || []).map(cell => (cell && cell.v !== null && cell.v !== undefined) ? String(cell.v) : "")
          );
          resolve(rows);
        };

        script.onerror = () => {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          cleanup();
          reject(new Error("スクリプト読み込みエラー"));
        };

        script.src = `https://docs.google.com/spreadsheets/d/${info.id}/gviz/tq?tqx=out:json;responseHandler:${cbName}&gid=${info.gid}&headers=0`;
        document.body.appendChild(script);
      });
    }

    function parseYouTube(urlStr) {
      if (!urlStr) return { videoId: "", timeLabel: "", thumb: "", baseUrl: "" };
      try {
        const u = new URL(urlStr.trim());
        let videoId = u.searchParams.get("v") || "";
        if (!videoId && u.hostname.includes("youtu.be")) videoId = u.pathname.replace("/", "");
        if (!videoId && u.pathname.includes("/live/")) videoId = u.pathname.split("/live/")[1].split("/")[0];
        const tRaw = u.searchParams.get("t") || "";
        const sec = parseInt(tRaw.replace(/\D/g, ""), 10);
        let timeLabel = "";
        if (!isNaN(sec) && sec > 0) {
          const h = Math.floor(sec / 3600);
          const m = Math.floor((sec % 3600) / 60);
          const s = sec % 60;
          const pad = n => String(n).padStart(2, "0");
          timeLabel = h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
        }
        const pl = SITE_CONFIG.playlistId ? `&list=${SITE_CONFIG.playlistId}` : "";
        return {
          videoId,
          timeLabel,
          thumb: videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : "",
          baseUrl: videoId ? `https://www.youtube.com/watch?v=${videoId}${pl}` : urlStr
        };
      } catch {
        return { videoId: "", timeLabel: "", thumb: "", baseUrl: urlStr };
      }
    }

    function renderProfile() {
      if (typeof PROFILE_CONFIG === "undefined") return;
      document.getElementById("profName").textContent = PROFILE_CONFIG.name || "";
      document.getElementById("profRuby").textContent = PROFILE_CONFIG.ruby || "";
      const capEl = document.getElementById("illustCaption");
      if (PROFILE_CONFIG.illustCaption) {
        capEl.textContent = PROFILE_CONFIG.illustCaption;
      } else {
        capEl.style.display = "none";
      }
      document.getElementById("profTags").innerHTML =
        (PROFILE_CONFIG.tags || []).map(t => `<span class="profile-tag"># ${esc(t)}</span>`).join("");

      const lines = (PROFILE_CONFIG.bio || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const specs = [];
      const leads = [];
      let quote = "";
      let closing = "";

      lines.forEach((line, i) => {
        const specMatch = line.match(/^([^：:]{1,12})[：:]\s*(.+)$/);
        if (i === 0 && /^「.+」$/.test(line)) {
          quote = line;
        } else if (i === lines.length - 1 && /^「.+」$/.test(line)) {
          closing = line.replace(/^「|」$/g, "");
        } else if (specMatch) {
          const label = specMatch[1].trim();
          const text = specMatch[2].trim();
          let icon = "📌";
          if (label.includes("夢") || label.includes("モットー")) icon = "🌟";
          else if (label.includes("配信")) icon = "🎙️";
          else if (label.includes("企画")) icon = "🗺️";
          specs.push({ icon, label, text });
        } else {
          leads.push(line);
        }
      });

      const quoteEl = document.getElementById("profQuote");
      if (quote) {
        quoteEl.textContent = quote;
        quoteEl.style.display = "inline-block";
      }

      const leadEl = document.getElementById("profLead");
      if (leads.length > 0) {
        leadEl.textContent = leads.join(" ");
        leadEl.style.display = "block";
      } else if (PROFILE_CONFIG.catchcopy) {
        leadEl.textContent = PROFILE_CONFIG.catchcopy;
        leadEl.style.display = "block";
      }

      const specsEl = document.getElementById("profSpecs");
      if (specs.length > 0) {
        specsEl.innerHTML = specs.map(s => `
          <div class="prof-spec-item">
            <span class="prof-spec-label">${s.icon} ${esc(s.label)}</span>
            <span class="prof-spec-text">${esc(s.text)}</span>
          </div>
        `).join("");
        specsEl.style.display = "flex";
      }

      const closingEl = document.getElementById("profClosing");
      if (closing) {
        closingEl.textContent = `☕ ${closing}`;
        closingEl.style.display = "block";
      }
    }

    // スクロール位置に合わせて上の目次バーをハイライト
    const sections = ["sec-top", "sec-profile", "sec-map", "sec-search"];
    window.addEventListener("scroll", () => {
      let current = "sec-top";
      sections.forEach(id => {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= 140) current = id;

    function switchView(mode) {
      document.getElementById("viewMap").style.display = mode === "map" ? "block" : "none";
      document.getElementById("viewOrder").style.display = mode === "order" ? "block" : "none";
      document.getElementById("tabMap").classList.toggle("active", mode === "map");

    let items = [];
    let prefMap = {};
    let epByPref = {};
    let episodeList = [];
    let selectedCat = "";

    function selectPref(prefName) {
      document.querySelectorAll("[data-pref]").forEach(el => {
        el.classList.toggle("selected", el.dataset.pref === prefName);
      });

      const detailEl = document.getElementById("prefDetail");
      detailEl.classList.add("active");

      const list = prefMap[prefName] || [];
      const ep = epByPref[prefName];
      const status = list.length > 0 ? "done" : (ep && ep.status === "next" ? "next" : "none");

      if (status === "none") {
        detailEl.innerHTML = `
          <div class="detail-header"><h3>${esc(prefName)}</h3><span class="badge" style="background:#B8AEA4;">未制覇</span></div>
          <p style="margin:0;">まだルーレットで選ばれていません！今後の配信をお楽しみに✨</p>
        `;
        return;
      }

      const badgeColor = status === "done" ? "var(--done-orange)" : "var(--next-pink)";
      const badgeText = status === "done" ? `第${ep ? ep.no : "?"}回 制覇済み（${list.length}品）` : `第${ep ? ep.no : "?"}回 次回予定`;

      const selectYt = ep && ep.selectUrl ? parseYouTube(ep.selectUrl) : null;
      const reviewUrl = (ep && ep.reviewUrl) || (list[0] ? list[0].baseUrl : "");
      const reviewYt = reviewUrl ? parseYouTube(reviewUrl) : null;

      let videosHtml = `<div class="episode-videos">`;
      if (selectYt && selectYt.baseUrl) {
        videosHtml += `

              <span class="ep-video-step">① お土産選び</span>
              <div class="ep-video-title">美味しいもの見つけよう〜${esc(prefName)}編〜</div>
            </div>
          </a>`;
      }
      if (reviewYt && reviewYt.baseUrl) {
        videosHtml += `
          <a class="ep-video-card" href="${esc(reviewYt.baseUrl)}" target="_blank" rel="noopener">
            <div class="ep-thumb-wrap">
              <img src="${esc(reviewYt.thumb)}" alt="食べよう サムネイル" />
              <span class="ep-play-badge">▶ YouTubeで観る</span>
            </div>
            <div class="ep-video-info">
              <span class="ep-video-step eat">② 実食レポ</span>
              <div class="ep-video-title">美味しいもの食べよう〜${esc(prefName)}編〜</div>
            </div>
          </a>`;

      detailEl.innerHTML = `
        <div class="detail-header">
          <h3>${ep ? `第${ep.no}回 ` : ""}${esc(prefName)}編</h3>
          <span class="badge" style="background:${badgeColor};">${badgeText}</span>
        </div>
        ${(selectYt || reviewYt) ? videosHtml : ""}
        ${list.length > 0
          ? `<div class="souvenir-list">${list.map(item => createItemRow(item, false)).join("")}</div>`
          : `<p style="margin:0;">※お土産（食べよう）のデータは実食配信後に追加予定です！</p>`
        }
      `;
    }

    function createItemRow(item, showPref = true) {
      const meta = CAT_META[item.category] || { icon: "🍽️", cls: "" };

        <div class="item-row">

        </div>
      `;
    }

    function setCat(cat) {

    let catCounts = {};
    let catList = [];
    function renderChips() {
      const chipsEl = document.getElementById("catChips");

      catList.forEach(c => {

      });
      chipsEl.innerHTML = html;
    }

    function renderAll() {
      const kw = document.getElementById("searchInput").value.trim().toLowerCase();
      const pf = document.getElementById("prefSelect").value;

      const filtered = items.filter(item => {
        const epText = item.epNo ? `第${item.epNo}回` : "";
        const text = `${epText} ${item.pref} ${item.name} ${item.category} ${item.memo}`.toLowerCase();
        if (kw && !text.includes(kw)) return false;
        if (pf && item.pref !== pf) return false;
        if (selectedCat && item.category !== selectedCat) return false;
        return true;
      });

      document.getElementById("hitCount").textContent = `${filtered.length}品 表示中`;
      document.getElementById("souvenirList").innerHTML =
        filtered.map(item => createItemRow(item, true)).join("") ||
        "<p style='padding:1rem; margin:0; color:var(--muted-text);'>条件に合う商品が見つかりませんでした。</p>";
    }

    function buildUI(episodesData, itemRows) {
      episodeList = episodesData;
      epByPref = {};
      episodeList.forEach(ep => { epByPref[normPref(ep.pref)] = ep; });

      items = [];
      prefMap = {};

      itemRows.forEach((cols, idx) => {
        if (!cols || cols.length < 2) return;
        const rawPref = (cols[0] || "").trim();
        const name = (cols[1] || "").trim();
        if (idx === 0 && (rawPref === "都道府県" || name === "商品名")) return;
        const pref = normPref(rawPref);
        if (!pref || !name) return;

        const url = (cols[2] || "").trim();
        const category = (cols[3] || "").trim();
        const memo = (cols[4] || "").trim();

        const yt = parseYouTube(url);
        const ep = epByPref[pref];
        const pl = SITE_CONFIG.playlistId ? `&list=${SITE_CONFIG.playlistId}` : "";
        const urlWithPl = url && !url.includes("list=") && pl ? `${url}${pl}` : url;

        const item = { pref, epNo: ep ? ep.no : null, name, url: urlWithPl, category, memo, ...yt };
        items.push(item);
        if (!prefMap[pref]) prefMap[pref] = [];
        prefMap[pref].push(item);
      });

      const mapEl = document.getElementById("japanMap");
      const epEl = document.getElementById("episodeList");
      mapEl.innerHTML = "";
      epEl.innerHTML = "";
      let doneCount = 0;

      PREFS.forEach(p => {
        const list = prefMap[p.name] || [];
        const ep = epByPref[p.name];
        const status = list.length > 0 ? "done" : (ep && ep.status === "next" ? "next" : "none");
        if (status === "done") doneCount++;

        const btn = document.createElement("button");
        btn.className = `pref-tile status-${status}`;
        btn.textContent = p.name;
        btn.dataset.pref = p.name;
        btn.style.gridColumn = `${p.c} / span ${p.w || 1}`;
        btn.style.gridRow = `${p.r} / span ${p.h || 1}`;
        btn.onclick = () => selectPref(p.name);
        mapEl.appendChild(btn);
      });

      episodeList.forEach(ep => {
        const pName = normPref(ep.pref);
        const list = prefMap[pName] || [];
        const isNext = list.length === 0 && ep.status === "next";
        const card = document.createElement("button");
        card.className = `ep-card ${isNext ? "is-next" : ""}`;
        card.dataset.pref = pName;
        card.innerHTML = `
          <div class="ep-no">第${ep.no}回</div>
          <div class="ep-pref">${esc(pName)}編</div>
          <div class="ep-sub">${list.length > 0 ? `制覇済み（${list.length}品）` : "次回予定（見つけよう公開中）"}</div>
        `;
        card.onclick = () => selectPref(pName);
        epEl.appendChild(card);
      });

      document.getElementById("progressCount").textContent =
        `${doneCount} / 47 都道府県制覇（${Math.round(doneCount / 47 * 100)}%）｜計 ${items.length}品`;
      document.getElementById("progressBar").style.width = `${(doneCount / 47) * 100}%`;

      const prefSelect = document.getElementById("prefSelect");
      prefSelect.innerHTML = `<option value="">すべての都道府県（開催順）</option>`;
      episodeList.forEach(ep => {
        const pName = normPref(ep.pref);
        if (!prefMap[pName]) return;
        const opt = document.createElement("option");
        opt.value = pName;
        opt.textContent = `第${ep.no}回 ${pName} (${prefMap[pName].length}品)`;
        prefSelect.appendChild(opt);
      });

      catCounts = {};
      items.forEach(i => {
        if (i.category) catCounts[i.category] = (catCounts[i.category] || 0) + 1;
      });
      const chipOrder = ["スイーツ", "飲み物", "スナック・塩菓子", "おつまみ・惣菜", "麺・ご飯・スープ", "調味料・ご飯のお供"];
      catList = [...new Set([...chipOrder, ...Object.keys(catCounts)])].filter(c => catCounts[c] > 0);

      renderChips();
      renderAll();
    }

    async function init() {
      document.getElementById("fallbackTitle").textContent = SITE_CONFIG.title;
      document.getElementById("siteSubtitle").textContent = SITE_CONFIG.subtitle;
      document.getElementById("siteFooter").textContent = SITE_CONFIG.disclaimer;
      document.getElementById("playlistBtn").href = `https://www.youtube.com/playlist?list=${SITE_CONFIG.playlistId}`;

      renderProfile();

      let itemRows = RAW_CSV_DATA.trim() ? parseCSV(RAW_CSV_DATA.trim()) : [];
      let episodesData = EPISODES;

      if (SITE_CONFIG.sheetItemsCsvUrl) {
        try {
          itemRows = await loadSheetViaJsonp(SITE_CONFIG.sheetItemsCsvUrl);
          console.log(`✅ 商品スプレッドシート読込成功（${itemRows.length}行）`);
        } catch (e) {
          console.warn("商品スプレッドシートの取得に失敗したためバックアップを使用します:", e);
        }
      }

      if (SITE_CONFIG.sheetEpisodesCsvUrl) {
        try {
          const rows = await loadSheetViaJsonp(SITE_CONFIG.sheetEpisodesCsvUrl);
          const parsedEps = [];
          rows.forEach((cols, idx) => {
            const noRaw = (cols[0] || "").trim();
            const pref = (cols[1] || "").trim();
            if (idx === 0 && (isNaN(Number(noRaw)) || pref === "都道府県")) return;
            if (!noRaw || !pref) return;
            parsedEps.push({
              no: Number(noRaw),
              pref,
              selectUrl: (cols[2] || "").trim(),
              status: (cols[3] || "").trim()
            });
          });
          if (parsedEps.length > 0) episodesData = parsedEps;
          console.log(`✅ 開催順スプレッドシート読込成功（${parsedEps.length}件）`);
        } catch (e) {
          console.warn("開催順スプレッドシートの取得に失敗したためバックアップを使用します:", e);
        }
      }

      buildUI(episodesData, itemRows);
    }

    document.getElementById("searchInput").addEventListener("input", renderAll);
    document.getElementById("prefSelect").addEventListener("change", renderAll);

    init();
  </script>
</body>
</html>
